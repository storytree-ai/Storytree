name: CI

# The green gate, and (for PRs) the merge that follows it — ADR-0022.
# Runs on every PR into main and on direct pushes to main. workflow_dispatch exists for the
# post-merge full-suite backstop (ADR-0195 §5): the automerge job's GITHUB_TOKEN merge cannot
# trigger the push run (GitHub anti-recursion — same reason the deploy dispatch exists), so after
# an affected-only merge it dispatches a full run on main here instead. A dispatched run takes the
# full `-r` path (the affected step is PR-only).
#
# `merge_group` is the MERGE QUEUE half of ADR-0304 (D3/D4). GitHub's native queue builds a temporary
# branch holding this PR on top of the PRs already queued ahead of it — the PROJECTED post-merge trunk
# — and asks for checks on it. Without this trigger the required checks would never run on a queue
# entry and every queued PR would sit forever, so THIS TRIGGER IS THE PREREQUISITE, and it is inert
# until the queue is switched on.
#
# ⚠ THE QUEUE IS DECLINED AND WILL NOT BE SWITCHED ON (ADR-0362 D1, owner-directed 2026-08-13,
# withdrawing ADR-0304 D3). Measured: across all 80 dispatched full-suite backstop runs on `main`
# (ADR-0195 §5, 2026-07-14 → 2026-08-12) `main` landed red ONCE, on `check:agents` — a live-store
# projection race a queue does not prevent — and on ZERO stale-base semantic breaks, the one hazard a
# queue is the right instrument for. Against that it costs ~2x runner minutes (speculative building
# is mandatory, not optional) and serialises landings that already land concurrently (ADR-0345 D3).
#
# THIS TRIGGER AND EVERY `merge_group` GUARD BELOW ARE KEPT ON PURPOSE (ADR-0362 D2b) — they cost
# nothing with no queue, and keeping them means reconsidering the decision is a SETTINGS change
# rather than a rebuild. DO NOT strip them as dead code. The re-entry condition is narrow
# (ADR-0362 D3): a stale-base semantic break actually OBSERVED landing on `main`. If that ever
# fires, the owner-side flip is a repo setting, not a file (verified 2026-08-13: `main` still
# carries no ruleset and no branch protection):
#   1. a ruleset / branch-protection rule on `main` with "Require merge queue" enabled,
#   2. `verify` marked as a required status check on it,
#   3. repo setting `delete_branch_on_merge` turned on — the queue merges the PR itself, so the
#      `--delete-branch` flag the automerge job passes no longer does the deleting,
#   4. a speculative build count >= the lanes in flight, WITHOUT which a queue is slower than today.
# Nothing below changes meanwhile: `gh pr merge` merges directly exactly as it does today, and the
# automerge job stays correct on BOTH sides of that flip — see its merge step.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A new push to the same PR/branch supersedes an in-flight run.
#
# NEVER for a merge-queue run: each queue entry gets its own `refs/heads/gh-readonly-queue/...` ref so
# nothing would collide anyway, but a cancelled check reads to the queue as a FAILED one and evicts the
# PR. Turning cancellation off for `merge_group` makes that impossible rather than merely unlikely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# CI KEEPS tsx's ON-DISK TRANSFORM CACHE, and the empty string is what keeps it
# (`the-gate-costs-what-the-change-risks-arc` inc 4).
#
# Everywhere else in this repo the cache is turned OFF: `scripts/tsx-cache-off.mjs` is preloaded ahead
# of every `--import tsx`, because tsx writes one file per transform into a FLAT `os.tmpdir()`
# directory and never evicts, and on a long-lived dev box that directory reaches hundreds of thousands
# of files — at which point a cache LOOKUP costs more than the transform it saves (232,254 files /
# 4.18 GB measured; the whole test leg went 745s -> 444s with it off).
#
# A HOSTED RUNNER IS THE ONE PLACE THAT CANNOT HAPPEN: every job gets a fresh VM, so the cache starts
# empty and is healthy BY CONSTRUCTION. There the cache is a large WIN, not a tax. Measured locally at
# suite scale, `pnpm -r --no-bail test`, same 5,475 tests in every arm:
#
#   tsx cache, FRESH directory   296s (cold) then 277s / 273s      <- what a runner gets
#   tsx cache OFF                358s
#
# — so disabling it here would cost roughly 30%, and the CI `Test` step did move 216s -> 320s on the
# PR that landed the repo-wide default (#1464 vs #1460; directional, different diffs).
#
# THE EMPTY STRING IS LOAD-BEARING AND IS NOT A TYPO. tsx tests this variable for TRUTHINESS, so
# `TSX_DISABLE_CACHE: "0"` would still DISABLE the cache. `scripts/tsx-cache-off.mjs` sets it with
# `??=`, which leaves an explicitly-set value — including an empty one — alone. So "" is the only
# spelling that reaches tsx as "keep the cache".
env:
  TSX_DISABLE_CACHE: ""

jobs:
  # ---------------------------------------------------------------------------
  # The gate. Typecheck / test / build are offline and need no secrets.
  #
  # CI IS NO LONGER DB-FREE (ADR-0302 D3). The retained guidance and agent projection checks
  # authenticate through the SAME keyless WIF identity the automerge job has used on every merged PR since
  # ADR-0033 — no new pool, no new IAM, no new secret (infra/ci-presence.tf). This closes the class
  # of reds that could only ever fire on the dev box while CI showed green.
  #
  # THAT DEPENDED ON THE DATABASE RUNNING 24/7 (ADR-0302 D2), and the dependency is not incidental:
  # `storytree-ci-presence` holds cloudsql.client + cloudsql.instanceUser and NO wake role — the wake
  # permission is bound to the studio runtime SA alone (infra/studio-db-wake.tf). Under ADR-0114's
  # old 01:00-07:00 Sydney sleep window, every overnight PR would have redded on an instance CI has
  # no way to start. That window is gone; do not re-introduce one without re-deciding this.
  # ---------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    # The affected-scope decision ('full' | 'affected'; empty on push/dispatch runs, where the
    # step is skipped) — read by the automerge job's post-merge backstop dispatch (ADR-0195 §5).
    outputs:
      mode: ${{ steps.affected.outputs.mode }}
    # contents: read for checkout; pull-requests: read for the ADR cross-PR collision check (ADR-0050);
    # id-token: write to mint the WIF OIDC token for the live-store checks below (ADR-0302 D3).
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      # legacy/Agentic is a private submodule and not part of the pnpm workspace,
      # so the default no-submodule checkout is correct (and avoids needing creds).
      # fetch-depth 2 keeps the PR merge commit's FIRST PARENT (the base tip the merge was cut
      # against) available — the affected-scope step below diffs HEAD^1..HEAD (ADR-0195).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # ADR-number collision check across OPEN PRs (ADR-0050, Layer 2). The adr-health
      # `adr-number-unique` gate (in `pnpm -r test` below) catches a number already on main / on this
      # merge ref; this fast PR-only step additionally catches a truly-concurrent pair before either
      # merges. Fail-OPEN on gh/network errors, fail-CLOSED only on a real clash (the script's contract).
      - name: ADR number collision (open PRs)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/adr-pr-collision-check.sh

      # A branch is ONE landed unit — it dies on merge (ADR-0142). The merge job below clears the
      # merged branch's claim-ledger state (node_claim, ADR-0200) keyed on the head ref, so
      # re-landing the same branch name would erase live sessions from the map and feed the
      # stale-PR trap family. Refuse a PR whose head branch already has a merged PR. Fail-open on
      # gh errors, like the ADR collision check above.
      - name: Merged-branch guard (a branch dies on merge)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/merged-branch-guard.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Organism boundary (ADR-0074): the real cross-organism code-dependency graph must be a
      # subgraph of the declared cross-story `depends_on` graph (substrate/ports excepted). Refuses
      # an undeclared cross-story coupling or a dependency cycle — so coupling can't be added without
      # a declared edge, which the studio forest then renders (no invisible coupling).
      - name: Organism boundary
        run: pnpm check:boundaries

      # Source-ownership totality (ADR-0317 D2, charged by ADR-0301 — verification-integrity-arc
      # `ownership-map-holds-totality`). `check:boundaries` above is at PACKAGE grain and correctly
      # passes while a NEW file inside an owned package falls under no declared `sourceOwnership`
      # subtree — measured on PR #1326, where a full gate went green with the map already
      # incomplete. Charged BY AUTHORSHIP: a file this PR adds (or one it un-owns by deleting a
      # declaration) REDS; a file already unowned on the base tip is reported and never charged, so
      # a PR is never billed for the standing drain. Deliberately a ROOT step, OUTSIDE the ADR-0195
      # narrowing below — a new unowned file may land in any package, including one the affected
      # filter would not select.
      #
      # It anchors "before" on HEAD^1 here, exactly as `pnpm ci:affected` does: this is the
      # pull_request MERGE ref, `fetch-depth: 2` keeps its first parent, and no `origin/main` is
      # fetched (see `chooseBaseRef`).
      - name: Source-ownership totality
        run: pnpm check:ownership-totality

      # Cross-surface mirror conformance (verification-integrity-arc inc 2). Surfaces that
      # re-compose another's route — the desktop backend hand-mirrors the studio's /api/docs walk
      # and may never import it (ADR-0176) — must serve the SAME payload. Each surface is run by
      # its own probe in its own process over one shared input and the JSON is diffed. Deliberately
      # a ROOT step, OUTSIDE the ADR-0195 affected-only narrowing below: drift is introduced by
      # editing EITHER surface, and the affected filter would run only the edited one's suite.
      - name: Cross-surface mirror conformance
        run: pnpm check:mirror-conformance

      # Clone the PINNED web submodule so the grounding check validates the exact vendored site.
      # storytree-web is PUBLIC, so this needs no creds (unlike the private legacy/Agentic, which is
      # why the checkout above takes no submodules). ADR-0056.
      - name: Check out the pinned web submodule
        run: |
          sha=$(git ls-tree HEAD web | awk '{print $3}')
          if [ -z "$sha" ]; then echo "no web gitlink in HEAD"; exit 1; fi
          rm -rf web
          git clone --quiet https://github.com/storytree-ai/storytree-web.git web
          git -C web checkout --quiet "$sha"

      # The public site's load-bearing claims carry data-grounds="ADR-…" refs; fail if any cites a
      # missing or superseded ADR — the doctrine-drift guard (ADR-0056). storytree-web can't
      # self-check; only this repo sees the ADR corpus.
      - name: web claims grounded
        run: pnpm check:web-grounding

      # The site consumes the shared forest-world render core as a SYNCED @generated artifact
      # (web/src/lib/forest-world/), not as private source — ADR-0093 Decision 3. Fail if that copy
      # has drifted from packages/forest-world (re-sync with `pnpm sync:web-engine` + bump the
      # submodule). SKIPs while the pinned site hasn't adopted the core yet (no forest-world/ dir) —
      # the render-core twin of `check:web-grounding`, needs the cloned web/ above.
      - name: web engine in sync
        run: pnpm check:web-engine

      # No WebGL in Act 1's static import closure (ADR-0336, re-wiring only the closure third of the
      # retired check:web-experience — ADR-0311 D2). SKIPs (bootstrap allowance) until the site adopts
      # an experience entry; needs the cloned web/ above.
      - name: web experience closure
        run: pnpm check:web-experience-closure

      # Affected-only PR scope (ADR-0195, amends ADR-0022; ADR-0304 D2 puts the SAME classifier
      # behind the local `pnpm gate`): classify the PR's changed files and,
      # when every one maps cleanly into the workspace graph, narrow typecheck+test to the changed
      # projects PLUS their dependents (pnpm's `--filter "...<name>"`). Conservative by
      # construction — any root-path file (stories/**, docs/decisions/**, scripts/**, lockfile, …),
      # any package.json, or the cross-boundary corpus seed (apps/studio/data/**) forces the full
      # `-r` run, because those inputs are read by tests the dependency graph can't see. The
      # push-to-main run below never narrows (`|| '-r'` when this step is skipped) — the backstop
      # that keeps main green if a PR gate ever under-selects; fix forward from there. A MERGE-QUEUE
      # run never narrows either (this step is PR-only): the queue's whole job is proving the
      # PROJECTED post-merge trunk, so the full `-r` suite is the correct scope there.
      - name: Affected scope (PRs only)
        id: affected
        if: github.event_name == 'pull_request'
        run: pnpm ci:affected

      - name: Typecheck
        run: pnpm ${{ steps.affected.outputs.pnpm_args || '-r' }} typecheck

      # @storytree/core corpus validation + the node:test suites across packages.
      # This is the gate per CLAUDE.md ("Gate: pnpm -r typecheck · pnpm -r test") — scoped to the
      # affected projects on PRs (ADR-0195), full on pushes to main.
      - name: Test
        run: pnpm ${{ steps.affected.outputs.pnpm_args || '-r' }} test

      # The only buildable target is apps/studio (`vite build`); the packages
      # export raw TS and have no build step. studio's `vite build` used to fail
      # because its dev API pulled the Node-only store substrate into config load;
      # that store import is now lazy, so the gate verifies the client build too.
      - name: Build
        run: pnpm -r build

      # -----------------------------------------------------------------------
      # SHARED LIVE SOURCE — deliberately after this branch's typecheck, tests, and build.
      # ADR-0302/0307 moved the Library agent tier to the live store while keeping its generated
      # harness projections committed. A sibling can therefore move the source beneath this branch;
      # these are real catches, but they must not precede the branch-local proof they do not own.
      - name: Authenticate to GCP for live guidance (keyless WIF — ADR-0021)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/635716509357/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: storytree-ci-presence@storytree-498613.iam.gserviceaccount.com

      # CLAUDE.md, AGENTS.md and definitions.generated.json are generated root views of the live
      # session-orchestrator/definition tier. Fail rather than silently ship stale operating rules.
      - name: Root agent guidance in sync
        env:
          STORYTREE_DB_USER: storytree-ci-presence@storytree-498613.iam
        run: pnpm check:guidance

      # The four native harness directories are generated views of the live delegatable agents.
      - name: Harness agents in sync
        env:
          STORYTREE_DB_USER: storytree-ci-presence@storytree-498613.iam
        run: pnpm check:agents

      # ADR-0223 D3: the authored `dependsOn` dependency edge must stay acyclic. Live-store like its
      # two neighbours above, and here for the same reason — the corpus is the shared thing a branch
      # can break without touching a file, so a branch-local gate would never see it. ONE bulk read.
      - name: Library dependsOn DAG is acyclic
        env:
          STORYTREE_DB_USER: storytree-ci-presence@storytree-498613.iam
        run: pnpm check:library-dag-acyclic

  # ---------------------------------------------------------------------------
  # Auto-merge-on-green, done inside free Actions (GitHub-native auto-merge is
  # paywalled on private repos). Runs only for PRs, only after `verify` passes.
  # Opt out of a given PR by marking it a draft or adding the `hold` label.
  # ---------------------------------------------------------------------------
  automerge:
    name: automerge
    needs: verify
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'hold')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # mint the WIF OIDC token for keyless GCP auth (presence-retire below)
      actions: write # dispatch deploy-studio.yml after a studio-affecting merge (ADR-0061)
    steps:
      # ADR-0304 D4: the merge ceremony is unchanged in shape — a session opens a non-draft PR and
      # never merges by hand. What changes once the queue is switched on is WHERE the merge happens.
      # `gh pr merge` handles both without a flag change: against a base branch that requires a merge
      # queue it ADDS THE PR TO THE QUEUE instead of merging it (gh's own documented behaviour), and
      # the queue merges it later, against projected trunk.
      #
      # So the outcome has to be READ BACK, not assumed. Every step after this one is post-MERGE work
      # — releasing the branch's claims, deploying the merged tree — and running it against a PR that
      # is merely QUEUED would release claims early and deploy a `main` the PR is not in yet.
      - name: Merge now that the gate is green (or enter the merge queue)
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --merge \
            --delete-branch
          # `state`, NOT `merged` — gh exposes no `merged` field, and asking for one is a HARD ERROR
          # listing the valid names rather than an empty result. That typo shipped in #1139 and cost
          # exactly what this step is guarding: the PR merged, this step then died under `set -e`, and
          # all eight post-merge steps were skipped — no claim release, no deploy dispatch. Verified
          # against a real PR before landing this time; MERGED / OPEN are the only two states reachable
          # here, since the `gh pr merge` above either merged it or queued it.
          state=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json state --jq '.state' || echo "")
          case "$state" in
            MERGED)
              echo "merged=true" >> "$GITHUB_OUTPUT"
              echo "Merged directly — no merge queue on this base branch."
              ;;
            OPEN)
              echo "merged=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Handed to the merge queue (ADR-0304 D3). The queue will test this PR against projected trunk and merge it in order; the post-merge steps below are skipped for this run."
              ;;
            *)
              # Neither state: the read itself failed. Post-merge work is not safe to run OR to skip on
              # a guess, so this is loud rather than defaulted — the claim release is fail-soft and
              # recoverable by hand, but a deploy dispatched for a tree the change is not in is not.
              echo "merged=false" >> "$GITHUB_OUTPUT"
              echo "::error::Could not read PR state after merging (got '${state}'). The merge itself may have succeeded — check the PR. Post-merge steps are skipped; re-run claim release / deploy dispatch by hand if it did merge."
              exit 1
              ;;
          esac

      # -----------------------------------------------------------------------
      # Claim-release backstop (ADR-0138 §4 / ADR-0200): the merge that just
      # landed IS the authoritative "this branch's work is done" fact, so release
      # ALL of the merged branch's `events.node_claim` rows here — the guaranteed
      # machine clear the claim ledger needs (a branch dies on merge, ADR-0142).
      #
      # EVERYTHING below is FAIL-SOFT: every step is `continue-on-error: true` and
      # the writer itself never exits non-zero. The merge already happened and the
      # claim is advisory coordination state — this must NEVER fail the merge job.
      #
      # Deliberately UNGATED on the head-ref shape: claims are keyed by the FULL
      # head branch and ANY branch shape can hold them — the ADR-0200 D3 lobby
      # ceremony mints `worktree-…` branches, and PR #1024's
      # `worktree-adr0270-capability-grain` claim outlived its merge by 46 minutes
      # under the old `claude/*` gate (a presence-era assumption; presence retired
      # with ADR-0200 D7). A branch with no claims is a clean no-op in the writer.
      # Auth is keyless WIF (ADR-0021) — no JSON key in a secret.
      #
      # `steps.merge.outputs.merged == 'true'` on every step from here down is the
      # merge-queue guard (ADR-0304 D3): this is post-MERGE work, and a QUEUED PR
      # has not merged yet. Today that expression is always true, so nothing about
      # this job's behaviour changes until the queue is switched on. The explicit
      # `success() &&` preserves the implicit condition an `if:` would otherwise
      # replace — a failed earlier step must still skip these, as it does now.
      # -----------------------------------------------------------------------
      - name: Checkout (for the claim-release writer)
        if: success() && steps.merge.outputs.merged == 'true'
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Authenticate to GCP (keyless WIF — ADR-0021)
        id: gcp_auth
        if: success() && steps.merge.outputs.merged == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          # The pool + provider + CI service account are provisioned by infra/ci-presence.tf
          # (owner runs `terraform apply` once — see infra/ci-presence.md). The full provider
          # resource name embeds the project NUMBER (635716509357), not the project id.
          workload_identity_provider: projects/635716509357/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: storytree-ci-presence@storytree-498613.iam.gserviceaccount.com

      - name: Set up pnpm
        if: success() && steps.merge.outputs.merged == 'true'
        continue-on-error: true
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Set up Node
        if: success() && steps.merge.outputs.merged == 'true'
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: success() && steps.merge.outputs.merged == 'true'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # Releases the merged branch's node_claim rows (ADR-0138 §4 — the guaranteed machine
      # clear of the wisp-claim, keyed on the head-ref branch). Fail-soft.
      - name: Release the merged branch's claims (fail-soft)
        if: success() && steps.merge.outputs.merged == 'true'
        continue-on-error: true
        env:
          # The CI service account's Cloud SQL IAM username (the `.iam` short form —
          # Cloud SQL truncates `.gserviceaccount.com`, mirroring the studio host).
          STORYTREE_DB_USER: storytree-ci-presence@storytree-498613.iam
          STORYTREE_MERGED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        # Package-scoped exec resolves the workspace's pinned tsx (a @storytree/notice-board devDep) —
        # `npx tsx` from root would download tsx fresh (no root .bin in this pnpm workspace).
        # ADR-0077: the merge-ingest writer moved into the notice-board organism's ./store subpath.
        run: pnpm --filter @storytree/notice-board exec tsx src/store/ingest-merge.ts

      # -----------------------------------------------------------------------
      # Full-suite backstop on merged main (ADR-0195 §5). The GITHUB_TOKEN merge
      # above cannot trigger ci.yml's own push run (GitHub anti-recursion — the
      # same rule the deploy dispatch below works around), so when this PR's
      # verify ran AFFECTED-ONLY, dispatch a full run on main to prove the merged
      # tree whole. Skipped when verify ran the full suite on the merge ref —
      # that run IS the full proof (ADR-0022's model), and a second one would
      # spend the minutes the affected scope just saved. Fail-soft: a missed
      # dispatch degrades the backstop to the next full-scoped run on main, and
      # must never block the LOUD deploy dispatch below (which stays LAST).
      #
      # Under a MERGE QUEUE this backstop is not needed and is correctly skipped
      # by the `merged` guard: the queue runs `verify` on the projected trunk with
      # the affected step disabled, so the full suite has ALREADY run against the
      # tree that is about to become main. ADR-0195 §5 exists because a direct
      # GITHUB_TOKEN merge leaves the merged tree unproven at full scope; the
      # queue closes that hole at its source.
      # -----------------------------------------------------------------------
      - name: Dispatch full CI on main after an affected-only merge (ADR-0195)
        if: success() && steps.merge.outputs.merged == 'true' && needs.verify.outputs.mode == 'affected'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main --repo ${{ github.repository }}

      # -----------------------------------------------------------------------
      # CD trigger for auto-merged studio changes (ADR-0061, amends ADR-0046).
      #
      # The GITHUB_TOKEN merge above does NOT cascade the push-triggered
      # deploy-studio.yml (GitHub anti-recursion), so a studio change that
      # AUTO-merges would silently not deploy. `workflow_dispatch` is the
      # documented exception — it fires even from GITHUB_TOKEN given the
      # `actions: write` scope granted on this job — and a dispatch on `--ref
      # main` runs as a `refs/heads/main` OIDC token, which the deploy SA's
      # main-scoped WIF binding (infra/studio-cd.tf) already accepts. So this
      # closes the gap with NO new secret and NO new IAM. Gated to the ADR-0046
      # studio-affecting path set so a non-studio merge doesn't deploy.
      #
      # MUST stay the LAST step in this job. Unlike the fail-soft claim-release
      # above, a missed deploy is the bug being fixed, so this is deliberately
      # LOUD (no continue-on-error). The claim-release steps default to
      # if: success(), so a dispatch failure here must not be able to skip them —
      # keeping it last guarantees that. Runs for every auto-merged PR; the path
      # gate, not a branch gate, decides whether to deploy.
      #
      # ALSO GUARDED ON `merged` (ADR-0304 D3), and this is the guard that matters
      # most: dispatching a deploy on `--ref main` for a PR that is only QUEUED
      # would build and ship a `main` the change is not in yet — a silent deploy of
      # the wrong tree. Skipping is the safe direction. The EXPECTATION at flip time is that
      # this dispatch stops being needed, because a merge-queue merge is not a
      # GITHUB_TOKEN merge and so should trigger deploy-studio.yml's own `push`
      # run directly — VERIFY that on the first studio-affecting merge after the
      # queue is enabled rather than assuming it.
      # -----------------------------------------------------------------------
      - name: Dispatch studio deploy on a studio-affecting merge (ADR-0061)
        if: success() && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The PR record (and its file list) persists after the merge above.
          files=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --json files --jq '.files[].path')
          echo "Merged PR touched:"; echo "$files"
          # The ADR-0046 studio-affecting path set (mirrors deploy-studio.yml's paths:).
          if echo "$files" | grep -qE '^(apps/studio/|packages/|docs/|stories/|pnpm-lock\.yaml$|package\.json$|infra/studio-cloudbuild\.yaml$|\.github/workflows/deploy-studio\.yml$)'; then
            echo "Studio-affecting — dispatching deploy-studio.yml on main."
            gh workflow run deploy-studio.yml --ref main --repo ${{ github.repository }}
          else
            echo "No studio-affecting paths — skipping deploy dispatch."
          fi
