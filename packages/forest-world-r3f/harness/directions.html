<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>five islands, built to look good — chapter2 (dev-only)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #2b3138;
        color: #cfd8dc;
        font: 14px/1.55 system-ui, sans-serif;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 28px 80px;
      }
      h1 {
        font-size: 25px;
        margin: 0 0 10px;
        color: #eceff1;
      }
      h2 {
        font-size: 16px;
        margin: 40px 0 6px;
        color: #b7e08a;
        border-top: 1px solid #3b434c;
        padding-top: 18px;
      }
      header p {
        max-width: 78ch;
        color: #b0bec5;
      }
      p.lede {
        max-width: 78ch;
        color: #9fb0ba;
        margin: 4px 0 18px;
      }
      p.numbers {
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #cfd8dc;
        background: #232930;
        border: 1px solid #3b434c;
        border-radius: 8px;
        padding: 10px 14px;
        max-width: 78ch;
      }
      .row {
        display: flex;
        gap: 26px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .panel {
        margin: 0;
      }
      .panel figcaption {
        display: flex;
        flex-direction: column;
        gap: 1px;
        margin-bottom: 7px;
      }
      .panel figcaption strong {
        color: #eceff1;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .panel figcaption span {
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8fa0aa;
      }
      /* The checkerboard the islands are judged against: a flat panel colour would let a
         reader mistake background for silhouette, and this arc has already lost a
         measurement to exactly that. */
      .stage {
        background-color: #3a424b;
        background-image: linear-gradient(45deg, #333a42 25%, transparent 25%),
          linear-gradient(-45deg, #333a42 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #333a42 75%),
          linear-gradient(-45deg, transparent 75%, #333a42 75%);
        background-size: 12px 12px;
        background-position: 0 0, 0 6px, 6px -6px, -6px 0;
        border: 1px solid #4a545e;
        border-radius: 6px;
        padding: 10px;
        display: inline-block;
        line-height: 0;
      }
      p.lede.caveat {
        border-left: 2px solid #7a6a4a;
        padding-left: 12px;
        color: #cbbd9a;
      }
      p.lede.caveat strong {
        color: #e6d5a8;
      }
      ul.calls {
        max-width: 78ch;
        color: #9fb0ba;
        font-size: 13px;
        padding-left: 20px;
      }
      ul.calls strong {
        color: #cfd8dc;
      }
      code {
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d6e6b8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/directions.tsx"></script>
  </body>
</html>
